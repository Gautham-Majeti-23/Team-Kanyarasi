<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spam Detector</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    margin: 0;
  }
  .card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px 0;
  }
  p.subtitle {
    color: #666;
    margin: 0 0 24px 0;
    font-size: 14px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #93b4f0;
    cursor: not-allowed;
  }
  .examples {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .examples button {
    width: auto;
    margin-top: 0;
    background: #eef2ff;
    color: #2563eb;
    font-weight: 500;
    font-size: 12px;
    padding: 6px 10px;
  }
  #result {
    margin-top: 24px;
    padding: 16px;
    border-radius: 8px;
    display: none;
  }
  #result.spam {
    background: #fef2f2;
    border: 1px solid #fca5a5;
  }
  #result.ham {
    background: #f0fdf4;
    border: 1px solid #86efac;
  }
  .label {
    font-size: 18px;
    font-weight: 700;
  }
  .spam .label { color: #dc2626; }
  .ham .label { color: #16a34a; }
  .confidence {
    color: #444;
    font-size: 13px;
    margin-top: 4px;
  }
  .triggers {
    margin-top: 10px;
    font-size: 13px;
  }
  .chip {
    display: inline-block;
    background: white;
    border: 1px solid #ccc;
    border-radius: 999px;
    padding: 2px 10px;
    margin: 4px 4px 0 0;
    font-size: 12px;
  }
  .error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Spam Detector</h1>
  <p class="subtitle">Paste a message below and check whether it looks like spam.</p>

  <textarea id="messageInput" placeholder="Paste an email or text message here..."></textarea>

  <div class="examples">
    <button onclick="fillExample('Hey, are we still on for lunch tomorrow?')">Try: normal message</button>
    <button onclick="fillExample('CONGRATULATIONS! You have WON a $1000 prize. Click here NOW to claim!!!')">Try: spam example</button>
  </div>

  <button id="submitBtn" onclick="classify()">Check message</button>

  <div id="errorBox" class="error"></div>

  <div id="result">
    <div class="label" id="resultLabel"></div>
    <div class="confidence" id="resultConfidence"></div>
    <div class="triggers" id="resultTriggers"></div>
  </div>
</div>

<script>
const API_URL = "http://127.0.0.1:5000/classify";

function fillExample(text) {
  document.getElementById("messageInput").value = text;
}

async function classify() {
  const input = document.getElementById("messageInput");
  const btn = document.getElementById("submitBtn");
  const resultBox = document.getElementById("result");
  const errorBox = document.getElementById("errorBox");

  const message = input.value.trim();

  errorBox.textContent = "";
  resultBox.style.display = "none";

  if (!message) {
    errorBox.textContent = "Please enter a message first.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Checking...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      errorBox.textContent = data.error || "Something went wrong.";
      return;
    }

    const isSpam = data.label === "spam";
    resultBox.className = isSpam ? "spam" : "ham";
    resultBox.style.display = "block";

    document.getElementById("resultLabel").textContent =
      isSpam ? "🚫 Spam" : "✅ Not spam";

    document.getElementById("resultConfidence").textContent =
      `Confidence: ${(data.confidence * 100).toFixed(1)}%`;

    const triggersEl = document.getElementById("resultTriggers");
    if (data.trigger_words && data.trigger_words.length > 0) {
      triggersEl.innerHTML = "Trigger words: " +
        data.trigger_words.map(w => `<span class="chip">${w}</span>`).join("");
    } else {
      triggersEl.innerHTML = "";
    }

  } catch (err) {
    errorBox.textContent = "Could not reach the server. Is app.py running?";
  } finally {
    btn.disabled = false;
    btn.textContent = "Check message";
  }
}
</script>

</body>
</html>
